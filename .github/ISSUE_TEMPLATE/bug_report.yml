name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting it. Logs can contain what you said, so please remove anything personal before you paste them.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see it happen?
      description: Steps to reproduce it, if you know them.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.6"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model
      placeholder: MacBook Air (M3)
  - type: dropdown
    id: stt
    attributes:
      label: Transcription
      options: [Cloud, Local (Parakeet)]
  - type: dropdown
    id: voice
    attributes:
      label: Joe's voice
      options: [Fish Audio, Gemini, Kitten]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The last lines of /tmp/kitten-tts.log and /tmp/voice-pet.log, with anything personal removed.
      render: text
